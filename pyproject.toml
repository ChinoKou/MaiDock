[project]
name = "maidock"
version = "1.0.4"
description = "为 MaiBot 提供额外的 OpenAI Responses、Anthropic Messages、阿里云百炼 DashScope、硅基流动 与 火山方舟 Responses 等端点支持与高级参数控制功能的插件。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "json-repair>=0.60.1",
    "maibot-plugin-sdk>=2.5.3",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.16",
]
